name: Repository verification and dataset admission
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Existing commit to use as the catalog admission comparison base
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project and development dependencies
        run: |
          python -m pip install -e '.[dev]'
          npm ci
      - name: Select explicit admission comparison base
        env:
          BASE_SHA: ${{ github.event.inputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          test -n "$BASE_SHA"
          test "$BASE_SHA" != "0000000000000000000000000000000000000000"
          BASE_COMMIT=$(git rev-parse "$BASE_SHA^{commit}")
          test "$BASE_COMMIT" != "$(git rev-parse HEAD)"
          if git cat-file -e "$BASE_COMMIT:data/catalog.json" 2>/dev/null; then
            BASE_CATALOG=data/catalog.json
          else
            BASE_CATALOG=catalog.json
          fi
          git show "$BASE_COMMIT:$BASE_CATALOG" > "$RUNNER_TEMP/base-catalog.json"
          python -m canopy admission --base "$RUNNER_TEMP/base-catalog.json"
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox
      - name: Run shared local verification entrypoint
        run: python -m canopy verify
