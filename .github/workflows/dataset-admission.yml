name: Dataset admission
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate added and changed dataset reviews
        env:
          # On pull_request, compare against the merge base; on push, against the previous commit.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 tests/test_catalog_reviews.py
          git show "$BASE_SHA:catalog.json" > "$RUNNER_TEMP/base-catalog.json"
          python3 scripts/validate_catalog_reviews.py --base "$RUNNER_TEMP/base-catalog.json"
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          catalog = json.loads(Path('catalog.json').read_text())
          script = Path('catalog.js').read_text()
          assert json.loads(script.split('=', 1)[1].strip().rstrip(';')) == catalog, 'Catalog snapshots differ'
          PYTHON
      - name: Validate curated graph and generated views
        run: |
          python3 -m pip install -r scripts/classification/requirements-audit.txt
          python3 scripts/knowledge_model.py
          python3 tests/test_knowledge_model.py
          python3 tests/test_catalog_content.py
          python3 tests/test_knowledge_hub_service.py
          python3 tests/test_pinned_sources.py
          python3 scripts/for_instance/test_pipeline.py
          python3 tests/test_task_package.py
          python3 tests/test_fgi_preparation.py
          python3 tests/test_task_plan.py
          python3 tests/test_task_dataset.py
          python3 tests/test_dataset_plan.py
          python3 tests/test_browser_preparation.py
          python3 tests/test_browser_container.py
          python3 tests/test_classification.py
          python3 tests/test_classification_package.py
          python3 tests/test_classification_acquire.py
          python3 tests/test_classification_audit.py
          node --test tests/test_*.mjs
          node --check browser-prepare/intake.js
          node --check browser-prepare/worker.js
          node --check browser-prepare/ui.js
          node --check browser-prepare/download-ui.js
          node --check container-lab/worker.js
          node --check container-lab/ui.js
          node --check task-selection.js
          node --check app.js
          node --check workbench.js
          for path in browser-prepare/classification-*.js; do node --check "$path"; done
  classification-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned isolated acceptance tools
        run: |
          python -m pip install -r scripts/classification/requirements-browser-tests.txt
          python -m playwright install --with-deps chromium firefox
      - name: Verify browser exports with independent ZIP and LAS readers
        run: python tests/classification_browser_acceptance.py
