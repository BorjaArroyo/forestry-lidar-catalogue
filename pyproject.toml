[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy-forestry-lidar-catalogue"
version = "0.1.0"
description = "Curated forestry LiDAR catalogue and reviewed task data tools"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[project.scripts]
canopy = "canopy.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.17.1"]
browser-audit = ["playwright==1.58.0"]
classification = ["lazrs==0.8.2", "zstandard==0.25.0"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
cache-dir = "temp/cache/ruff"
target-version = "py314"
line-length = 100
force-exclude = true
extend-exclude = [
  "scripts/for_instance/**",
  "scripts/fgi_emit/**",
  "scripts/audit_fgi_measurements.py",
  "browser-prepare/vendor/**",
  "temp/**",
  "evidence/**",
  "reviews/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
